<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIB demo: grid on/off</title>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
  <style>
    body { background: #000; color: #eee; }
    .jspsych-content { max-width: 980px; }
    canvas { background: #000; display: block; margin: 0 auto; }
    .small { font-size: 18px; line-height: 1.65; color: #ddd; }
    .title { font-size: 28px; margin-bottom: 14px; }
  </style>
</head>
<body></body>
<script>

//Motion-induced blindness demonstraction
//Programmed by Yousuke Kawachi


// jsPsychの初期化
const jsPsych = initJsPsych();

// 刺激全体の拡大率（1.0が元サイズ）
const S = 1.3;
// 刺激パラメータ：サイズ・間隔・位置・色など
const params = {
  w: 600*S, h: 600*S, spacing: 52*S, range: 3,
  crossHalf: 15*S, crossWidth: 2*S,
  fixHalf: 17*S, fixWidth: 3*S,
  targetSize: 15*S, targetX: -78*S, targetY: -76*S,
  blue: '#0000e6', red: '#ff0000', yellow: '#ffff00'
};

// 各条件の消失回数・消失時間・消失率を保存
const mibResults = [];

// MIB刺激を描画する関数
function drawMIB(ctx, t, gridOn, rotateOn) {
  const p = params;
  const cx = p.w/2, cy = p.h/2;
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,p.w,p.h);
  if (gridOn) {
    // 回転速度：分母を小さくすると速く，大きくすると遅くなる
    const angle = rotateOn ? (t * Math.PI / 2000) : 0;
    const ca = Math.cos(angle), sa = Math.sin(angle);
    ctx.strokeStyle = p.blue;
    ctx.lineWidth = p.crossWidth;
    ctx.lineCap = 'round';
    for (let ix=-p.range; ix<=p.range; ix++) {
      for (let iy=-p.range; iy<=p.range; iy++) {
        const x = ix*p.spacing, y = iy*p.spacing;
        const rx = ca*x - sa*y;
        const ry = sa*x + ca*y;
        const px = cx + rx, py = cy + ry;
        const vx = {x: ca*p.crossHalf, y: sa*p.crossHalf};
        const vy = {x: -sa*p.crossHalf, y: ca*p.crossHalf};
        ctx.beginPath();
        ctx.moveTo(px-vx.x, py-vx.y); ctx.lineTo(px+vx.x, py+vx.y);
        ctx.moveTo(px-vy.x, py-vy.y); ctx.lineTo(px+vy.x, py+vy.y);
        ctx.stroke();
      }
    }
  }
  // target
  ctx.fillStyle = p.yellow;
  const tx = cx+p.targetX, ty = cy+p.targetY;
  ctx.fillRect(tx-p.targetSize/2, ty-p.targetSize/2, p.targetSize, p.targetSize);
  // fixation
  ctx.strokeStyle = p.red;
  ctx.lineWidth = p.fixWidth;
  ctx.beginPath();
  ctx.moveTo(cx-p.fixHalf, cy); ctx.lineTo(cx+p.fixHalf, cy);
  ctx.moveTo(cx, cy-p.fixHalf); ctx.lineTo(cx, cy+p.fixHalf);
  ctx.stroke();
}

// 1試行分のMIBデモ
const mib_trial = {
  type: jsPsychHtmlKeyboardResponse,
  choices: "NO_KEYS",
  stimulus: function(){ return `<div></div>`; },
  trial_duration: null,
  on_load: function() {
    const trial = {
      name: jsPsych.timelineVariable('name'),
      label: jsPsych.timelineVariable('label'),
      grid: jsPsych.timelineVariable('grid'),
      rotate: jsPsych.timelineVariable('rotate'),
      duration: jsPsych.timelineVariable('duration')
    };
    const container = document.querySelector('.jspsych-content');
    container.innerHTML = `
      <div class="small" style="margin-bottom:8px;">
        <b>${trial.label}</b><br>
        赤い十字を見続けてください。<br>
        黄色の四角が消えたらスペースキーを押し続け，再び見えたら離してください。<br>
        <span style="color:#aaa;">G: 青グリッドON/OFF，R: 回転ON/OFF，N: 次の条件へ</span>
      </div>
      <canvas id="mibCanvas" width="${params.w}" height="${params.h}"></canvas>
      <div class="small" id="status" style="margin-top:8px;"></div>`;
    const canvas = document.getElementById('mibCanvas');
    const ctx = canvas.getContext('2d');
    let gridOn = trial.grid;
    let rotateOn = trial.rotate;
    let start = performance.now();
    let downStart = null;
    let invisEpisodes = [];
    let ended = false;
    const status = document.getElementById('status');
    function frame(now) {
      if (ended) return;
      const elapsed = now-start;
      drawMIB(ctx, elapsed, gridOn, rotateOn);
      const remaining = Math.max(0, Math.ceil((trial.duration - elapsed)/1000));
      status.textContent = `残り ${remaining} 秒 ／ 記録された消失回数: ${invisEpisodes.length}`;
      if (elapsed >= trial.duration) endTrial();
      else requestAnimationFrame(frame);
    }
    function endTrial() {
      if (ended) return;
      ended = true;
      const now = performance.now();
      if (downStart !== null) {
        invisEpisodes.push({start_ms: Math.round(downStart-start), end_ms: Math.round(now-start)});
        downStart = null;
      }
      window.removeEventListener('keydown', keydown);
      window.removeEventListener('keyup', keyup);
      const actualDurationMs = Math.min(now - start, trial.duration);
      const totalDisappearanceMs = invisEpisodes.reduce((s,e)=>s+(e.end_ms-e.start_ms),0);
      const disappearancePercent = actualDurationMs > 0 ? (totalDisappearanceMs / actualDurationMs) * 100 : 0;

      mibResults.push({
        label: trial.label,
        n: invisEpisodes.length,
        total_ms: totalDisappearanceMs,
        percent: disappearancePercent
      });

      jsPsych.finishTrial({
        condition: trial.name,
        grid_initially_on: trial.grid,
        rotate_initially_on: trial.rotate,
        duration_ms: trial.duration,
        disappearance_episodes_json: JSON.stringify(invisEpisodes),
        n_disappearances: invisEpisodes.length,
        total_disappearance_ms: totalDisappearanceMs
      });
    }
    function keydown(e) {
      if (e.code === 'Space') { e.preventDefault(); if (downStart === null) downStart = performance.now(); }
      if (e.code === 'KeyG') { gridOn = !gridOn; }
      if (e.code === 'KeyR') { rotateOn = !rotateOn; }
      if (e.code === 'KeyN') { endTrial(); }
    }
    function keyup(e) {
      if (e.code === 'Space') {
        e.preventDefault();
        if (downStart !== null) {
          invisEpisodes.push({start_ms: Math.round(downStart-start), end_ms: Math.round(performance.now()-start)});
          downStart = null;
        }
      }
    }
    window.addEventListener('keydown', keydown);
    window.addEventListener('keyup', keyup);
    requestAnimationFrame(frame);
  }
};

// -------------------- 実験の流れ --------------------
const timeline = [];
// 最初の教示画面
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
  <div style="min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; box-sizing:border-box;">
    <div class="title"><b>Motion-induced blindness</b></div><br>
    <div class="small" style="text-align:center; max-width:760px; margin:0 auto;">
      赤い十字を見続けると,黄色の四角形が一時的に消えることがあります。<br><br>
      黄色の四角が消えたらスペースキーを押し続け，再び見えたら離してください。<br>
      1試行は30秒です。<br><br>
      実行中は <b>G</b> で青グリッドON/OFF，<b>R</b> で回転ON/OFF，<b>N</b> で次の条件へ進めます。<br><br>
      Enterキーを押すと開始します。<br>
      必要ならブラウザの <b>F11</b> キーで全画面表示にしてください。
    </div>
  </div>`,
  choices: ['Enter']
});
// 条件1：回転運動あり
timeline.push({
  timeline: [mib_trial],
  timeline_variables: [
    {name:'grid_on', label:'条件1：回転運動あり', grid:true, rotate:true, duration:30000}
  ]
});

// 最終結果画面
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: function() {
    return `
      <div style="min-height:100vh; display:flex; justify-content:center; align-items:center; background:#000; box-sizing:border-box;">
        <div style="position:relative; width:${params.fixHalf*2}px; height:${params.fixHalf*2}px;">
          <div style="position:absolute; left:0; top:50%; width:100%; height:${params.fixWidth}px; background:${params.red}; transform:translateY(-50%);"></div>
          <div style="position:absolute; top:0; left:50%; height:100%; width:${params.fixWidth}px; background:${params.red}; transform:translateX(-50%);"></div>
        </div>
      </div>`;
  },
  choices: "NO_KEYS",
  trial_duration: 15000
});

// 条件2：回転運動なし
timeline.push({
  timeline: [mib_trial],
  timeline_variables: [
    {name:'grid_on', label:'条件2：回転運動なし', grid:true, rotate:false, duration:30000}
  ]
});
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: function() {
    const rows = mibResults.map(r => `
      <div style="margin:18px 0;">
        <b>${r.label}</b>では<br>
        <b>${r.n}回</b>消失 ／ <b>${(r.total_ms/1000).toFixed(1)}秒間</b>消失 ／ <b>${r.percent.toFixed(1)}%</b>消失
      </div>`).join('');
    return `
      <div style="min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; box-sizing:border-box;">
        <div class="title">結 果</div><br>
        <div class="small" style="text-align:center; max-width:760px; margin:0 auto; font-size:22px;">
          ${rows}
        </div>
      </div>`;
  },
  choices: "NO_KEYS"
});

window.addEventListener('error', function(e) {
  const msg = document.createElement('div');
  msg.style.cssText = 'position:fixed;left:20px;right:20px;bottom:20px;padding:12px;background:#400;color:#fff;font:16px sans-serif;z-index:9999;';
  msg.textContent = 'JavaScript error: ' + e.message;
  document.body.appendChild(msg);
});

jsPsych.run(timeline);
</script>
</html>
